name: RQ1 nested CV smoke tests

on:
  push:
    branches:
      - "feat/rq1-nested-task-cv-*"
  pull_request:
    paths:
      - "research/rq1/**"
      - "research/tests/test_rq1_nested_cv.py"
      - ".github/workflows/rq1-tests.yml"

jobs:
  rq1-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install required dependencies
        run: python -m pip install numpy pandas scikit-learn
      - name: Validate nested grouped evaluation
        run: python -m unittest discover -s research/tests -p 'test_rq1_nested_cv.py' -v
