name: RQ2 explanation regression

on:
  push:
    branches:
      - "feat/rq2-bytecode-explanation-validation-*"
  pull_request:
    paths:
      - "research/rq2/**"
      - "research/tests/test_rq2_explanations.py"
      - ".github/workflows/rq2-tests.yml"

jobs:
  rq2-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install numpy pandas scikit-learn
      - name: Test explanation contracts
        run: python -m unittest discover -s research/tests -p 'test_rq2_explanations.py' -v
